apiVersion: v1
kind: Pod
metadata:
  name: weatherbroadcaster-debug
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: update-weather
      image: lsstts/weatherbroadcaster:latest
      command:
        - python
        - -m
        - weatherbroadcaster.update_weather
      env:
        - name: WEATHERBROADCASTER_LOG_LEVEL
          value: INFO
      volumeMounts:
        - name: weather-data
          mountPath: /data
  volumes:
    - name: weather-data
      persistentVolumeClaim:
        claimName: weatherbroadcaster-weather-data
